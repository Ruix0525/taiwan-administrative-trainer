<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="author" content="Ru1zly" />
  <meta name="original-author" content="Ru1zly" />
  <meta name="application-name" content="台灣行政區訓練" />
  <meta name="theme-color" content="#f4f5f7" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3CforeignObject x='0' y='0' width='64' height='64'%3E%3Cdiv xmlns='http://www.w3.org/1999/xhtml' style='width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:50px;line-height:1;font-family:Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif;overflow:hidden'%3E%F0%9F%87%B9%F0%9F%87%BC%3C/div%3E%3C/foreignObject%3E%3C/svg%3E" />
<!-- Original Author: Ru1zly | Build: TW-ADMIN-TRAINER-RU1ZLY-STABLE-001 | Signature: EF20BFAAD67B08C465626A7C0AA5111BC9F0785D7A9184D5991F43FE590151FF -->
  <title>台灣行政區訓練</title>
  <script>
    (() => {
      const key = "tw368trainer_theme_v1";
      let theme = null;
      try { theme = localStorage.getItem(key); } catch (_) {}
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <style>
    :root{
      --bg:#f4f5f7;--panel:#ffffff;--ink:#15181d;--muted:#6b7280;--line:#d9dde4;
      --accent:#111827;--good:#1f9d55;--bad:#dc2626;--warn:#d97706;--soft:#eef1f5;
      --shadow:0 10px 28px rgba(15,23,42,.08);
      --button:#ffffff;--button-hover:#f8fafc;--active:#111827;
      --map-top:#f8fafc;--map-bottom:#eef2f7;--town:#ffffff;--town-hover:#e8edf4;
      --town-stroke:#98a2b3;--county-stroke:#111827;--map-label:#111827;
      --quiz:rgba(255,255,255,.97);--topbar-glass:rgba(248,250,252,.96);
      --nav-glass:rgba(255,255,255,.95);--loading:#f5f7fa;--drawer:#ffffff;
      --progress-track:#eceff3;--success-soft:#dcfce7;--error-soft:#fee2e2;
      color-scheme:light;
    }
    html[data-theme="dark"]{
      --bg:#070b12;--panel:#0f1623;--ink:#e7edf6;--muted:#93a1b5;--line:#263244;
      --accent:#d7e3f4;--good:#4ade80;--bad:#fb7185;--warn:#fbbf24;--soft:#172131;
      --shadow:0 14px 34px rgba(0,0,0,.38);
      --button:#141e2d;--button-hover:#1b293b;--active:#d7e3f4;
      --map-top:#0c1420;--map-bottom:#080d15;--town:#172334;--town-hover:#24354b;
      --town-stroke:#5e718b;--county-stroke:#b8c7da;--map-label:#f4f7fb;
      --quiz:rgba(11,17,27,.96);--topbar-glass:rgba(7,12,20,.94);
      --nav-glass:rgba(13,20,31,.96);--loading:#0b121d;--drawer:#0f1623;
      --progress-track:#253246;--success-soft:#153a29;--error-soft:#45202a;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}
    button,select,input{font:inherit}
    .app{width:100%;height:100vh;margin:0;padding:14px 18px;display:flex;flex-direction:column;overflow:hidden}
    .topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:12px;flex:0 0 auto}
    .brand-grid{
      display:grid;
      grid-template-columns:max-content var(--brand-title-width,max-content) max-content;
      grid-template-rows:auto auto;
      column-gap:9px;
      row-gap:0;
      align-items:stretch;
      width:max-content;
    }
    .brand-flag{
      grid-column:1;
      grid-row:1 / 3;
      align-self:center;
      font-size:24px;
      line-height:1;
      margin-right:1px;
    }
    .brand{
      grid-column:2;
      grid-row:1;
      align-self:center;
      font-weight:850;
      font-size:24px;
      line-height:1.08;
      letter-spacing:-.5px;
      white-space:nowrap;
    }
    .sub{
      grid-column:2;
      grid-row:2;
      align-self:center;
      width:100%;
      min-width:0;
      max-width:100%;
      color:var(--muted);
      font-size:13px;
      line-height:1.15;
      margin-top:0!important;
      white-space:nowrap;
      text-align:justify;
      text-align-last:justify;
      text-justify:inter-character;
    }
    .credit-stack{
      grid-column:3;
      grid-row:1 / 3;
      align-self:stretch;
      display:grid;
      grid-template-rows:minmax(0,1fr) minmax(0,1fr);
      height:100%;
      min-height:0;
    }
    .author-credit,
    .theme-credit{
      display:flex;
      align-items:center;
      min-height:0;
      color:var(--muted);
      font-size:16px;
      line-height:1;
      white-space:nowrap;
    }
    .author-credit{
      grid-row:1;
      font-weight:650;
      letter-spacing:.02em;
    }
    .theme-credit{
      grid-row:2;
      font-weight:600;
      letter-spacing:.01em;
      opacity:.78;
    }
    .mobile-header-actions,.mobile-drawer-head,.mobile-settings-actions,
    .mobile-overlay,.mobile-bottom-nav,.mobile-exam-action{display:none}
    .danger-soft{color:#b42318;border-color:#fecdca;background:var(--button)}
    .difficulty-block{
      display:flex;
      flex-direction:column;
      gap:7px;
      margin-top:2px;
    }
    .difficulty-label{
      font-size:11px;
      font-weight:800;
      color:var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .difficulty-switch{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:7px;
      padding:4px;
      border:1px solid var(--line);
      border-radius:15px;
      background:var(--soft);
    }
    .difficulty-pill{
      appearance:none;
      border:1px solid transparent;
      border-radius:11px;
      min-width:0;
      min-height:54px;
      padding:8px 9px;
      background:transparent;
      color:var(--muted);
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      gap:2px;
      cursor:pointer;
      text-align:left;
      transition:
        background .16s ease,
        border-color .16s ease,
        box-shadow .16s ease,
        color .16s ease,
        transform .12s ease;
    }
    .difficulty-pill:hover{
      background:var(--button-hover);
      color:var(--ink);
    }
    .difficulty-pill:active{transform:scale(.985)}
    .difficulty-pill.active{
      background:var(--button);
      color:var(--ink);
      border-color:var(--line);
      box-shadow:0 2px 7px rgba(16,24,40,.08);
    }
    .difficulty-pill[data-difficulty="hard"].active{
      background:#101828;
      color:#fff;
      border-color:#101828;
    }
    .difficulty-pill[data-difficulty="extreme"].active{
      background:#7f1d1d;
      color:#fff;
      border-color:#7f1d1d;
    }
    .difficulty-pill[data-difficulty="beginner"].active{
      background:#166534;
      color:#fff;
      border-color:#166534;
    }
    .difficulty-name{
      font-size:14px;
      font-weight:900;
      line-height:1.1;
    }
    .difficulty-desc{
      font-size:10.5px;
      line-height:1.25;
      font-weight:650;
      opacity:.78;
      white-space:normal;
    }


    .top-actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:var(--button);color:var(--ink);padding:10px 13px;border-radius:12px;cursor:pointer;font-weight:700}
    .tutorial-launch-btn{
      background:#fef3c7!important;
      color:#92400e!important;
      border-color:#f6d365!important;
      box-shadow:0 1px 2px rgba(146,64,14,.05);
    }
    html[data-theme="dark"] .tutorial-launch-btn{
      background:#3f3215!important;
      color:#fde68a!important;
      border-color:#725d22!important;
    }

    .tutorial-root{
      position:fixed;
      inset:0;
      z-index:6000;
      display:none;
      pointer-events:none;
    }
    .tutorial-root.open{
      display:block;
      pointer-events:auto;
    }
    .tutorial-blocker{
      position:absolute;
      inset:0;
      background:transparent;
      backdrop-filter:none;
      cursor:default;
      transition:background .18s ease;
    }
    .tutorial-blocker.full-dim{
      background:rgba(4,8,15,.76);
    }
    .tutorial-spotlight{
      position:fixed;
      z-index:1;
      border:2px solid rgba(255,255,255,.96);
      border-radius:16px;
      background:transparent;
      box-shadow:
        0 0 0 9999px rgba(4,8,15,.76),
        0 0 0 5px rgba(250,204,21,.20),
        0 12px 36px rgba(0,0,0,.22);
      pointer-events:none;
      opacity:0;
      transition:
        left .28s cubic-bezier(.22,.8,.2,1),
        top .28s cubic-bezier(.22,.8,.2,1),
        width .28s cubic-bezier(.22,.8,.2,1),
        height .28s cubic-bezier(.22,.8,.2,1),
        opacity .18s ease;
    }
    .tutorial-spotlight.visible{opacity:1}
    .tutorial-card{
      position:fixed;
      z-index:3;
      width:min(390px,calc(100vw - 28px));
      max-height:min(78vh,660px);
      overflow:hidden;
      padding:18px;
      display:flex;
      flex-direction:column;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--panel);
      color:var(--ink);
      box-shadow:0 22px 70px rgba(0,0,0,.35);
      pointer-events:auto;
      opacity:0;
      transform:translateY(8px) scale(.985);
      transition:
        left .28s cubic-bezier(.22,.8,.2,1),
        top .28s cubic-bezier(.22,.8,.2,1),
        opacity .18s ease,
        transform .18s ease;
    }
    .tutorial-root.open .tutorial-card{
      opacity:1;
      transform:translateY(0) scale(1);
    }
    .tutorial-card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
    }
    .tutorial-kicker{
      color:#a16207;
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:5px;
    }
    html[data-theme="dark"] .tutorial-kicker{color:#facc15}
    .tutorial-title{
      margin:0;
      font-size:21px;
      line-height:1.18;
      letter-spacing:-.25px;
    }
    .tutorial-step-count{
      flex:0 0 auto;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      padding-top:3px;
    }
    .tutorial-body{
      margin-top:13px;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
      overflow:auto;
      min-height:0;
      padding-right:2px;
    }
    .tutorial-body strong{color:var(--ink)}
    .tutorial-mini-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
      margin-top:11px;
    }
    .tutorial-mini-card{
      padding:9px 10px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--soft);
    }
    .tutorial-mini-card b{
      display:block;
      color:var(--ink);
      font-size:12px;
      margin-bottom:2px;
    }
    .tutorial-mini-card span{
      display:block;
      font-size:11px;
      line-height:1.35;
    }
    .tutorial-color-row{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:7px;
    }
    .tutorial-color-dot{
      width:13px;
      height:13px;
      border-radius:4px;
      flex:0 0 auto;
      border:1px solid rgba(0,0,0,.12);
    }
    .tutorial-progress-dots{
      display:flex;
      gap:5px;
      margin-top:16px;
    }
    .tutorial-progress-dots span{
      width:7px;
      height:7px;
      border-radius:999px;
      background:var(--line);
      transition:width .18s ease,background .18s ease;
    }
    .tutorial-progress-dots span.active{
      width:20px;
      background:#eab308;
    }
    .tutorial-actions{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:7px;
      margin-top:auto;
      padding-top:13px;
      border-top:1px solid var(--line);
      flex:0 0 auto;
      background:var(--panel);
    }
    .tutorial-actions-right{
      display:flex;
      gap:7px;
      margin-left:0;
    }
    .tutorial-actions .tutorial-text-btn{
      order:1;
      padding:0 10px;
    }
    .tutorial-actions .tutorial-actions-right{
      order:2;
    }
    .tutorial-text-btn,
    .tutorial-secondary-btn,
    .tutorial-primary-btn{
      border-radius:10px;
      min-height:38px;
      padding:0 12px;
      cursor:pointer;
      font-weight:800;
      font-size:12px;
    }
    .tutorial-text-btn{
      border:0;
      background:transparent;
      color:var(--muted);
    }
    .tutorial-secondary-btn{
      border:1px solid var(--line);
      background:var(--button);
      color:var(--ink);
    }
    .tutorial-secondary-btn:disabled{
      opacity:.38;
      cursor:default;
    }
    .tutorial-primary-btn{
      border:1px solid #eab308;
      background:#facc15;
      color:#422006;
    }
    .tutorial-primary-btn:hover{filter:brightness(.97)}
    .tutorial-card.side-placement{
      width:min(310px,calc(100vw - 28px));
    }

    body.tutorial-active{
      overflow:hidden!important;
      user-select:none;
    }

    .btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.06)}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.danger{background:#fff1f2;color:#b91c1c;border-color:#fecdd3}
    .layout{display:grid;grid-template-columns:310px minmax(0,1fr) 310px;grid-template-rows:minmax(0,1fr);gap:14px;flex:1 1 auto;min-height:0;height:100%;transition:grid-template-columns .34s cubic-bezier(.22,.8,.2,1);will-change:grid-template-columns}
    .sidebar{grid-column:1;grid-row:1;min-width:0}
    .map-panel{grid-column:2;grid-row:1;min-width:0}
    .right{grid-column:3;grid-row:1;min-width:0}
    .layout.hide-left{grid-template-columns:0 minmax(0,1fr) 310px}
    .layout.hide-right{grid-template-columns:310px minmax(0,1fr) 0}
    .layout.hide-left.hide-right{grid-template-columns:0 minmax(0,1fr) 0}
    @media (min-width:761px){
      .layout .sidebar,
      .layout .right{
        opacity:1;
        transform:translateX(0) scale(1);
        visibility:visible;
        transition:
          opacity .20s ease,
          transform .34s cubic-bezier(.22,.8,.2,1),
          visibility 0s linear 0s;
        will-change:opacity,transform;
      }
      .layout.hide-left .sidebar{
        opacity:0;
        transform:translateX(-18px) scale(.985);
        pointer-events:none;
        visibility:hidden;
        transition:
          opacity .18s ease,
          transform .30s cubic-bezier(.4,0,.2,1),
          visibility 0s linear .30s;
      }
      .layout.hide-right .right{
        opacity:0;
        transform:translateX(18px) scale(.985);
        pointer-events:none;
        visibility:hidden;
        transition:
          opacity .18s ease,
          transform .30s cubic-bezier(.4,0,.2,1),
          visibility 0s linear .30s;
      }
    }
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-height:0}
    .sidebar{padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto;overscroll-behavior:contain}
    .section-title{font-size:13px;font-weight:850;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .mode-btn{padding:12px 10px;border-radius:12px;border:1px solid var(--line);background:var(--button);color:var(--ink);cursor:pointer;font-weight:800}
    .mode-btn.active{background:var(--active);color:var(--bg);border-color:var(--active)}
    .control{display:flex;flex-direction:column;gap:6px}
    label{font-size:13px;color:var(--muted);font-weight:800}
    select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--button);color:var(--ink)}
    .option-select{padding:8px 10px;font-size:13px}
    .checkrow{display:flex;align-items:center;gap:8px;font-size:14px}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stat{background:var(--soft);padding:11px;border-radius:12px}
    .stat b{display:block;font-size:20px}
    .stat span{font-size:11px;color:var(--muted)}
    .map-panel{position:relative;height:100%;min-height:0;background:linear-gradient(var(--map-top),var(--map-bottom));display:flex;flex-direction:column;overscroll-behavior:contain}
    #map{width:100%;height:100%;flex:1 1 auto;min-height:0;display:block;touch-action:none;overscroll-behavior:contain;user-select:none}
    .town{fill:var(--town);stroke:var(--town-stroke);stroke-width:.45;vector-effect:non-scaling-stroke;cursor:pointer;shape-rendering:geometricPrecision}
    .labels text{
      paint-order:normal;
      stroke:none!important;
      filter:none!important;
      text-rendering:geometricPrecision;
      fill:var(--map-label)!important;
    }
    .labels tspan{dominant-baseline:middle}
    .is-zooming .town,.is-zooming .county-border{shape-rendering:optimizeSpeed}
    .is-zooming .town:hover{fill:var(--town)}
    .is-zooming .labels text{text-rendering:optimizeSpeed}
    .map-panel{contain:layout paint;content-visibility:auto}
    .town:hover{fill:var(--town-hover)}
    .town.correct{fill:#8ee5a9!important}
    .town.wrong{fill:#ff9b9b!important}
    .town.target{fill:#ffd875!important}
    .town.missed{fill:#ff6b6b!important}
    .town.learned{fill:#d9f6e2}
    .county-border{fill:none;stroke:var(--county-stroke);stroke-width:1.25;vector-effect:non-scaling-stroke;pointer-events:none}
    .quiz-card{position:relative;z-index:3;background:var(--quiz);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:7px 12px 8px;text-align:center;box-shadow:none;backdrop-filter:blur(8px);flex:0 0 auto}
    .quiz-label{font-size:9px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.05em}
    .question{font-size:20px;font-weight:900;margin-top:1px;line-height:1.15}
    .hint{font-size:11px;color:var(--muted);margin-top:3px}
    .feedback{margin-top:3px;font-size:12px;font-weight:800;min-height:15px}
    .map-panel.learn-mode .question{font-size:24px;line-height:1.2;margin:0;font-weight:900}
    .map-panel.learn-mode .quiz-label,.map-panel.learn-mode .hint{display:none}
    .map-panel.learn-mode .quiz-card{
      min-height:78px;
      padding:10px 16px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .map-panel.name-question-mode .quiz-card{
      min-height:82px;
      padding:10px 18px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .map-panel.name-question-mode .quiz-label,
    .map-panel.name-question-mode .hint{
      display:none;
    }
    .map-panel.name-question-mode .question{
      width:100%;
      margin:0;
      font-size:28px;
      line-height:1.15;
      font-weight:900;
      text-align:center;
      letter-spacing:-.35px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:54px;
    }

    .map-panel.reverse-mode .quiz-card{padding-bottom:7px}
    .zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:4}
    .zoom button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--button);color:var(--ink);font-weight:900;cursor:pointer}
    .focus-map-btn{
      position:relative;
      overflow:hidden;
      transition:
        transform .16s ease,
        background-color .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }
    .focus-map-btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.08)}
    .focus-map-btn:active{transform:scale(.94)}
    .focus-map-btn.active{
      background:var(--active);
      color:var(--bg);
      border-color:var(--active);
    }
    .focus-map-icon{
      display:inline-block;
      font-size:19px;
      line-height:1;
      transition:transform .32s cubic-bezier(.22,.8,.2,1);
    }
    .focus-map-btn.active .focus-map-icon{transform:rotate(180deg) scale(.92)}

    /* Smooth administrative-language swap without changing typography. */
    .labels,
    #question,
    #placeName,
    #placeCounty,
    #weakList{
      transition:opacity .16s ease,transform .16s ease,filter .16s ease;
    }
    body.admin-language-switching .labels,
    body.admin-language-switching #question,
    body.admin-language-switching #placeName,
    body.admin-language-switching #placeCounty,
    body.admin-language-switching #weakList{
      opacity:0;
      filter:blur(1.5px);

const THEME_KEY="tw368trainer_theme_v1";

function currentTheme(){
  return document.documentElement.dataset.theme==="dark"?"dark":"light";
}

function refreshThemeControls(){
  const isDark=currentTheme()==="dark";
  const actionLabel=isDark?"日間模式":"深夜模式";
  const actionIcon=isDark?"☀️":"🌙";
  const ariaLabel=isDark?"切換為日間模式":"切換為深夜模式";

  for(const button of document.querySelectorAll(".theme-toggle")){
    button.setAttribute("aria-pressed",isDark?"true":"false");

    if(label)label.textContent=actionLabel;
  }

  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute("content",isDark?"#070b12":"#f4f5f7");
}

function applyTheme(theme,{persist=true}={}){
  const next=theme==="dark"?"dark":"light";
  document.documentElement.dataset.theme=next;
  if(persist){
    try{localStorage.setItem(THEME_KEY,next)}catch(_){}

  refreshThemeControls();
}

}

document.querySelector("#themeBtn").onclick=toggleTheme;

let adminNameLanguage="zh";
const OFFICIAL_COUNTY_EN=new Map([
  ["臺北市","Taipei City"],
  ["台北市","Taipei City"],
  ["新北市","New Taipei City"],
  ["桃園市","Taoyuan City"],
  ["臺中市","Taichung City"],
  ["台中市","Taichung City"],
  ["臺南市","Tainan City"],
  ["台南市","Tainan City"],
  ["高雄市","Kaohsiung City"],
  ["基隆市","Keelung City"],
  ["新竹市","Hsinchu City"],
  ["嘉義市","Chiayi City"],

  ["彰化縣","Changhua County"],
  ["南投縣","Nantou County"],

  ["連江縣","Lienchiang County"]
]);

function adminTownName(feature){
  if(!feature)return "—";
  const p=feature.properties||{};
  // English mode uses the official TOWNENG field only.
  // If unavailable, keep the Chinese official name rather than inventing a translation.
  return adminNameLanguage==="en"
    ? (p.TOWNENG||p.TOWNNAME||"—")
    : (p.TOWNNAME||"—");
}

function adminCountyName(featureOrName){
  const chinese=typeof featureOrName==="string"
    ? featureOrName
    : ((featureOrName?.properties||{}).COUNTYNAME||"");

  return adminNameLanguage==="en"
    ? (OFFICIAL_COUNTY_EN.get(chinese)||chinese||"—")
    : (chinese||"—");
}

function hasDuplicateAdministrativeName(feature){
  if(!feature)return false;
  const rawName=(feature.properties||{}).TOWNNAME||"";
  return (townNameCounts.get(rawName)||0)>1;
}

function examAdministrativeName(feature){
  if(!feature)return "—";

  const town=adminTownName(feature);
  if(!hasDuplicateAdministrativeName(feature))return town;

  const county=adminCountyName(feature);

  // Chinese is compact and reads naturally without a separator:
  // 臺中市東區 / 臺南市東區
  // English keeps a normal space:
  // Taichung City East District
  return adminNameLanguage==="en"
    ? `${county} ${town}`
    : `${county}${town}`;
}

function adminTownLines(feature){
  const name=adminTownName(feature);

  if(adminNameLanguage!=="en" || !name || name==="—"){
    return [name];
  }

  const words=name.trim().split(/\s+/);
  if(words.length<=1)return [name];

  const suffixes=new Set([
    "District","Township","Town","City","Village"
  ]);

  const last=words[words.length-1];

  if(suffixes.has(last)){
    const first=words.slice(0,-1).join(" ");
    return first ? [first,last] : [last];
  }

  // For any other long official English name, split near the middle.
  if(name.length>=13){
    const midpoint=Math.ceil(words.length/2);
    return [
      words.slice(0,midpoint).join(" "),
      words.slice(midpoint).join(" ")
    ].filter(Boolean);
  }

  return [name];
}

function setAdminLabelText(node,feature){
  const lines=adminTownLines(feature);
  const selection=d3.select(node);

  selection.text("");

  const lineHeight=1.05;
  const startDy=lines.length===1
    ? 0
    : -((lines.length-1)*lineHeight)/2;

  lines.forEach((line,index)=>{
    selection.append("tspan")
      .attr("x",node.getAttribute("x"))
      .attr("dy",index===0?`${startDy}em`:`${lineHeight}em`)
      .text(line);
  });
}

function adminLabelMetrics(feature){
  const lines=adminTownLines(feature);
  return {
    lines,
    maxChars:Math.max(1,...lines.map(line=>[...line].length)),
    lineCount:Math.max(1,lines.length)
  };
}

const STORE_KEY="tw368trainer_stats_v1";

function scheduleExamTask(callback,delay){
  const timer=setTimeout(()=>{
    examTimers.delete(timer);
    if(examActive)callback();
  },delay);
  examTimers.add(timer);
  return timer;
}

function cloneStats(source){

}

function shuffleArray(items){
  const result=[...items];

  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }

  return result;
}

function buildExamQuestionPool(){
  let items=eligible();

  if(mode==="weak"){
    // Weak mode keeps the existing weakness weighting, but every place
    // still appears at most once in the same session.
    items=[...items].sort((a,b)=>{
      const sa=getStat(a);
      const sb=getStat(b);

      const na=sa.right+sa.wrong;
      const nb=sb.right+sb.wrong;

      const accA=na?sa.right/na:0;
      const accB=nb?sb.right/nb:0;

      const scoreA=(1-accA)*8+Math.max(1,4-sa.right)+Math.random()*1.5;
      const scoreB=(1-accB)*8+Math.max(1,4-sb.right)+Math.random()*1.5;

      return scoreB-scoreA;
    });
  }else{
    items=shuffleArray(items);
  }

  examQuestionPool=items;
  examQuestionIndex=0;
  examCompleted=false;
}

function takeNextExamQuestion(){
  if(examQuestionIndex>=examQuestionPool.length)return null;
  return examQuestionPool[examQuestionIndex++];
}

function showExamCompleteState(){
  examCompleted=true;
  examActive=false;
  answered=true;

  document.querySelector("#answers").style.display="none";
  document.querySelector("#question").textContent="本次測驗完成";
  document.querySelector("#hint").textContent=`已完成 ${examQuestionPool.length} 題`;
  document.querySelector("#feedback").textContent="";
  resetCurrentPlaceCard();
  updateExamButtons();
}


function sKey(f){return (f.properties.COUNTYNAME||"")+"|"+(f.properties.TOWNNAME||"")}
function getStat(f){
  const k=sKey(f); return stats[k]||{right:0,wrong:0,totalTime:0,last:0};
}
function saveStat(f,ok,sec){
  const k=sKey(f), s=getStat(f);
  if(ok)s.right++; else s.wrong++;
  s.totalTime+=(sec||0); s.last=Date.now(); stats[k]=s;
  localStorage.setItem(STORE_KEY,JSON.stringify(stats)); refreshSide();
}
function mastery(f){
  const s=getStat(f), n=s.right+s.wrong, acc=n?s.right/n:0;
  if(s.right>=3&&acc>=.8)return "green";
  if(n>=1&&acc>=.5)return "yellow";
  return "red";
}
function eligible(){
  const c=document.querySelector("#countyFilter").value;
  let a=towns;

  if(c!=="ALL"){
    a=a.filter(x=>(x.properties.COUNTYNAME||"")===c);
  }

  if(mode==="weak"){
    const weakOnly=a.filter(x=>mastery(x)!=="green");
    if(weakOnly.length)a=weakOnly;
  }

  return a;
}
function weightedPick(arr){
  const weights=arr.map(f=>{
    const s=getStat(f), n=s.right+s.wrong, acc=n?s.right/n:0;
    return n===0?5:(1-acc)*8+Math.max(1,4-s.right);
  });
  const total=weights.reduce((a,b)=>a+b,0); let r=Math.random()*total;
  for(let i=0;i<arr.length;i++){r-=weights[i];if(r<=0)return arr[i]}
  return arr[arr.length-1];
}
function visibleTowns(){
  const c=document.querySelector("#countyFilter").value;
  return c==="ALL" ? towns : towns.filter(x=>(x.properties.COUNTYNAME||"")===c);
}

function currentScopeName(){

}

function applyPersistentCorrect(){
  const hard=document.querySelector("#hardMode")?.checked;
  const extreme=document.querySelector("#extremeMode")?.checked;
  townLayer.selectAll(".town").classed("correct",false);

  // Extreme is a strict superset of Hard:
  // neither Hard nor Extreme keeps correctly answered regions green.
  if(hard || extreme || mode==="learn")return;

  townLayer
    .selectAll(".town")
    .filter(d=>correctHistory.has(sKey(d)))
    .classed("correct",true);
}

function applyPersistentMissed(){
  const extreme=document.querySelector("#extremeMode")?.checked;
  townLayer.selectAll(".town").classed("missed",false);

  if(extreme || mode==="learn")return;

  townLayer
    .selectAll(".town")
    .filter(d=>missedHistory.has(sKey(d)))
    .classed("missed",true);
}

function applyPersistentMarks(){
  applyPersistentCorrect();
  applyPersistentMissed();
}

function countyTransformFor(name){
  return countyTransforms.get(name)||d3.zoomIdentity;
}

function computeFitTransform(bounds,padding=26){
  const [[x0,y0],[x1,y1]]=bounds;
  const bw=Math.max(1,x1-x0);
  const bh=Math.max(1,y1-y0);
  const k=Math.min(
    (MAP_W-padding*2)/bw,
    (MAP_H-padding*2)/bh
  );
  const cx=(x0+x1)/2;
  const cy=(y0+y1)/2;

  return d3.zoomIdentity
    .translate(MAP_W/2-k*cx,MAP_H/2-k*cy)
    .scale(k);
}

function buildStaticMap(){
  svg.attr("viewBox",[0,0,MAP_W,MAP_H])
    .attr("preserveAspectRatio","xMidYMid meet");

  const allFeatures={type:"FeatureCollection",features:towns};
  staticProjection=d3.geoMercator().fitExtent(
    [[MAP_PAD,MAP_PAD],[MAP_W-MAP_PAD,MAP_H-MAP_PAD]],
    allFeatures
  );
  staticPath=d3.geoPath(staticProjection);

  g.selectAll("*").remove();

  townLayer=g.append("g").attr("class","town-layer");
  countyLayer=g.append("g").attr("class","county-layer");
  labelG=g.append("g").attr("class","labels");

  townLayer
    .selectAll("path.town")
    .data(towns,d=>sKey(d))
    .join("path")
    .attr("class","town")
    .attr("data-county",d=>d.properties.COUNTYNAME||"")
    .attr("d",staticPath)
    .on("click",(event,d)=>handleTownClick(d,event));

  countyLayer
    .selectAll("path.county-border")
    .data(counties,d=>d.properties.COUNTYNAME||"")
    .join("path")
    .attr("class","county-border")
    .attr("data-county",d=>d.properties.COUNTYNAME||"")
    .attr("d",staticPath);

  labelG
    .selectAll("text")
    .data(towns,d=>sKey(d))
    .join("text")
    .attr("x",d=>staticPath.centroid(d)[0])
    .attr("y",d=>staticPath.centroid(d)[1])
    .attr("data-county",d=>d.properties.COUNTYNAME||"")
    .attr("data-area",d=>staticPath.area(d))
    .each(function(d){
      setAdminLabelText(this,d);

      const metrics=adminLabelMetrics(d);
      const bounds=staticPath.bounds(d);
      const width=Math.max(1,bounds[1][0]-bounds[0][0]);
      const height=Math.max(1,bounds[1][1]-bounds[0][1]);

      const fitByWidth=(width/(metrics.maxChars+0.9))*0.86;
      const fitByHeight=(height/(metrics.lineCount*1.05))*0.58;
      const fitMap=Math.max(0.1,Math.min(fitByWidth,fitByHeight));

      this.setAttribute("data-fit-map",fitMap);
      this.setAttribute("data-fit-visible","0");
      this.setAttribute(
        "data-desired-screen",
        adminNameLanguage==="en"?"14.6":"13.4"
      );
    })
    .attr("text-anchor","middle")
    .attr("dominant-baseline","middle")
    .attr("pointer-events","none")
    .attr("fill","#111827")
    .attr("font-weight",700);

  labelNodes=labelG.selectAll("text").nodes();

  countyTransforms.set("ALL",d3.zoomIdentity);

  for(const countyName of new Set(towns.map(f=>f.properties.COUNTYNAME).filter(Boolean))){
    const features=towns.filter(f=>f.properties.COUNTYNAME===countyName);
    if(!features.length)continue;

    const collection={type:"FeatureCollection",features};
    countyTransforms.set(
      countyName,
      computeFitTransform(staticPath.bounds(collection),24)
    );
  }

  mapBuilt=true;
  applyMapState({resetView:true});
}

function updateLabelMetadataForScope(){
  const scoped=activeScope!=="ALL";
  countyScopedView=scoped;

  labelG.selectAll("text").each(function(){
    this.setAttribute(
      "data-desired-screen",
      adminNameLanguage==="en"
        ? (scoped?"18.2":"14.6")
        : (scoped?"17.0":"13.4")
    );
    this.setAttribute(
      "font-weight",
      adminNameLanguage==="en"
        ? (scoped?"680":"640")
        : (scoped?"660":"625")
    );
  });
}

function applyScopeVisibility(){
  const scoped=activeScope!=="ALL";

  townLayer

    );

    );

}

function applyBorderMode(){
  const borderMode=document.querySelector("#borderMode")?.value||"township";
  const showTownBorders=borderMode==="township";
  const showCountyBorders=borderMode!=="off";

  townLayer
    .selectAll(".town")

  countyLayer
    .style("display",showCountyBorders?"":"none");
}

function applyLabelMode(){
  labelG.style("display",mode==="learn"?"":"none");

  if(mode==="learn"){
    updateLabelMetadataForScope();
    updateLabelVisibility(currentZoomK);
    scheduleLabelLayout();
  }
}

function applyMapState({resetView=false}={}){
  if(!mapBuilt)return;

  activeScope=currentScopeName();
  activeScopeTransform=countyTransformFor(activeScope);

  applyScopeVisibility();
  applyBorderMode();
  applyLabelMode();
  applyPersistentMarks();

  if(resetView){
    const baseK=activeScopeTransform.k||1;
    zoom.scaleExtent([
      Math.max(0.8,baseK*0.72),
      Math.max(36,baseK*18)
    ]);

    currentZoomK=baseK;
    svg.interrupt().call(zoom.transform,activeScopeTransform);
  }

  if(current){
    const inScope=
      activeScope==="ALL" ||
      current.properties.COUNTYNAME===activeScope;

    if(inScope){
      if(mode==="reverse")highlightCurrent();
      else if(mode==="learn")flashFeature(current,"target");
    }

let labelLayoutRAF=0;

function labelScreenSize(node,k){
  const desiredBase=+node.getAttribute("data-desired-screen")||9;
  const fitMap=+node.getAttribute("data-fit-map")||0;
  const zoomGrowth=Math.min(1.58,1+0.22*Math.log2(Math.max(1,k)));
  return Math.min(desiredBase*zoomGrowth,fitMap*k);
}

function currentMapViewportBounds(){
  const rect=svg.node().getBoundingClientRect();
  const viewScale=Math.min(rect.width/MAP_W,rect.height/MAP_H);

  if(!Number.isFinite(viewScale) || viewScale<=0){
    return {left:0,right:MAP_W,top:0,bottom:MAP_H};
  }

  const visibleWidth=rect.width/viewScale;
  const visibleHeight=rect.height/viewScale;

  return {
    left:(MAP_W-visibleWidth)/2,
    right:(MAP_W+visibleWidth)/2,
    top:(MAP_H-visibleHeight)/2,
    bottom:(MAP_H+visibleHeight)/2
  };
}

function labelIsNearViewport(
  node,
  viewportBounds,
  transform=currentZoomTransform
){
  const x=+node.getAttribute("x");
  const y=+node.getAttribute("y");
  const screenX=transform.applyX(x);
  const screenY=transform.applyY(y);

  return (
    screenX>=viewportBounds.left-LABEL_VIEWPORT_OVERSCAN &&
    screenX<=viewportBounds.right+LABEL_VIEWPORT_OVERSCAN &&
    screenY>=viewportBounds.top-LABEL_VIEWPORT_OVERSCAN &&
    screenY<=viewportBounds.bottom+LABEL_VIEWPORT_OVERSCAN
  );
}

function updateLabelVisibility(k=1){
  if(mode!=="learn")return;

  const viewportBounds=currentMapViewportBounds();

  for(const node of labelNodes){
    const sameScope=
      activeScope==="ALL" ||
      node.getAttribute("data-county")===activeScope;

    if(!sameScope){
      node.style.display="none";
      node.setAttribute("data-fit-visible","0");
      continue;
    }

    if(!labelIsNearViewport(node,viewportBounds)){
      node.style.display="none";
      node.setAttribute("data-fit-visible","0");
      continue;
    }

    const rawSize=labelScreenSize(node,k);
    const screenSize=countyScopedView?Math.max(6.1,rawSize):rawSize;
    const visible=countyScopedView || screenSize>=6.1;

    node.setAttribute("data-fit-visible",visible?"1":"0");
    node.style.display=visible?"":"none";

    if(visible){
      node.setAttribute("font-size",screenSize/k);
    }
  }
}

function scheduleLabelLayout(){
  if(mode!=="learn")return;

  cancelAnimationFrame(labelLayoutRAF);
  labelLayoutRAF=requestAnimationFrame(()=>{
    labelLayoutRAF=0;
    updateLabelLayout();
  });
}

function updateLabelLayout(){
  if(mode!=="learn")return;

  for(const node of labelNodes){
    const sameScope=
      activeScope==="ALL" ||
      node.getAttribute("data-county")===activeScope;

    node.style.display=
      sameScope && node.getAttribute("data-fit-visible")==="1"
        ? ""
        : "none";
  }

  if(countyScopedView){
    return;
  }

  const candidates=labelNodes
    .filter(node=>
      node.getAttribute("data-fit-visible")==="1" &&
      node.style.display!=="none"
    )
    .sort((a,b)=>
      (+b.getAttribute("data-area")||0)-
      (+a.getAttribute("data-area")||0)
    );

  const keptBoxes=[];

  for(const node of candidates){
    const rect=node.getBoundingClientRect();
    const box={
      left:rect.left-3,
      right:rect.right+3,
      top:rect.top-2,
      bottom:rect.bottom+2
    };

    const overlap=keptBoxes.some(other=>!(
      box.right<other.left ||
      box.left>other.right ||
      box.bottom<other.top ||
      box.top>other.bottom
    ));

    if(overlap){
      node.style.display="none";
    }else{
      keptBoxes.push(box);
    }
  }
}

function makeChoices(){
  const pool=eligible().filter(x=>x!==current);
  const sameCounty=pool.filter(x=>x.properties.COUNTYNAME===current.properties.COUNTYNAME);
  const picks=[current];
  while(picks.length<4 && sameCounty.length){picks.push(sameCounty.splice(Math.floor(Math.random()*sameCounty.length),1)[0])}
  while(picks.length<4 && pool.length){const x=pool[Math.floor(Math.random()*pool.length)];if(!picks.includes(x))picks.push(x)}
  picks.sort(()=>Math.random()-.5);
  const box=document.querySelector("#answers"); box.innerHTML=""; box.style.display="grid";
  picks.forEach(f=>{
    const b=document.createElement("button");b.className="answer-btn";
    b.textContent=examAdministrativeName(f);
    b.dataset.key=sKey(f);
    b.onclick=()=>answerReverse(f,b);box.appendChild(b);
  });

function answerReverse(f,b){
  if(!examActive||answered)return;

  const hard=document.querySelector("#hardMode").checked;

    flashFeature(current,"correct"); updateSession();

function handleTownClick(d,event){
  updateCurrentCard(d);

    current=d;

    flashFeature(d,"target");

    document.querySelector("#hint").textContent="";
    return;
  }
  if(mode==="reverse"||!examActive||answered)return;

  const beginner=document.querySelector("#beginnerMode")?.checked;
  const exactMatch=sKey(d)===sKey(current);
  const sameCounty=
    (d.properties?.COUNTYNAME||"")===
    (current.properties?.COUNTYNAME||"");
  const ok=beginner ? sameCounty : exactMatch;
  const sec=(performance.now()-currentStart)/1000;

  if(ok){
    answered=true;session.correct++;session.times.push(sec);saveStat(current,true,sec);

    // Beginner mode tests county recognition rather than exact township position.
    // Keep the exact small region the user clicked green, as requested.
    correctHistory.add(sKey(beginner ? d : current));
    flashFeature(d,"correct");

    document.querySelector("#feedback").textContent=beginner
      ? `✅ 縣市正確：${adminCountyName(current)} · ${sec.toFixed(1)}s`
      : `✅ ${examAdministrativeName(current)} · ${sec.toFixed(1)}s`;

    updateSession();
    scheduleExamTask(nextQuestion,750);
  }else{
    session.wrong++;saveStat(current,false,sec);
    updateSession();

    answered=true;

    // Do not highlight the incorrectly clicked location.
    // Persistently mark only the location that should have been clicked.
    missedHistory.add(sKey(current));
    applyPersistentMissed();

    document.querySelector("#feedback").textContent=
      `❌ 你點到 ${examAdministrativeName(d)}｜正解：${examAdministrativeName(current)}`;

function zoomToContext(f){
  const el=townLayer
    .selectAll(".town")
    .filter(d=>sKey(d)===sKey(f))
    .node();

  if(!el)return;

  const b=el.getBBox();
  const cx=b.x+b.width/2;
  const cy=b.y+b.height/2;
  const baseK=activeScopeTransform.k||1;
  const desired=activeScope==="ALL"
    ? Math.max(baseK,4.6)
    : Math.max(baseK,baseK*1.75);

  const fitLimit=Math.min(
    MAP_W/Math.max(b.width*2.6,90),
    MAP_H/Math.max(b.height*2.6,90)
  );

  const k=Math.max(baseK,Math.min(desired,fitLimit));

  svg
    .transition()
    .duration(360)
    .call(
      zoom.transform,
      d3.zoomIdentity
        .translate(MAP_W/2-k*cx,MAP_H/2-k*cy)
        .scale(k)
    );
}

function zoomToFeature(f,scale=3){
  const el=townLayer
    .selectAll(".town")
    .filter(d=>sKey(d)===sKey(f))
    .node();

  if(!el)return;

  const b=el.getBBox();
  const cx=b.x+b.width/2;
  const cy=b.y+b.height/2;
  const baseK=activeScopeTransform.k||1;
  const k=Math.max(
    baseK,
    Math.min(
      baseK*scale,
      Math.min(
        MAP_W/Math.max(b.width,40),
        MAP_H/Math.max(b.height,40)
      )*0.6
    )
  );

  svg
    .transition()
    .duration(300)
    .call(
      zoom.transform,
      d3.zoomIdentity
        .translate(MAP_W/2-k*cx,MAP_H/2-k*cy)
        .scale(k)
    );
}

  const weak=towns.map(f=>({f,s:getStat(f)})).filter(x=>x.s.right+x.s.wrong>0)
    .sort((a,b)=>{
      const aa=a.s.right/(a.s.right+a.s.wrong),bb=b.s.right/(b.s.right+b.s.wrong);
      return aa-bb || (b.s.wrong-a.s.wrong);

async function loadTopoWithFallback(){
  let lastError = null;
  for (const url of DATA_URLS){
    try{
      document.querySelector("#loading").textContent = "載入台灣行政區地圖中…";
      const res = await fetch(url, {cache:"force-cache"});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if(!data || !data.objects || !data.objects.towns) throw new Error("TopoJSON 格式不完整");
      return data;
    }catch(err){
      console.warn("Map source failed:", url, err);
      lastError = err;
    }
  }
  throw lastError || new Error("所有地圖來源皆載入失敗");
}
async function init(){
  try{
    topo=await loadTopoWithFallback();
    towns=topojson.feature(topo,topo.objects.towns).features;
    counties=topo.objects.counties?topojson.feature(topo,topo.objects.counties).features:[];

    townNameCounts=new Map();
    for(const feature of towns){
      const rawName=(feature.properties||{}).TOWNNAME||"";
      if(rawName){
        townNameCounts.set(rawName,(townNameCounts.get(rawName)||0)+1);
      }
    }
    if(!towns.length) throw new Error("找不到鄉鎮市區資料");
    populateCounties();buildStaticMap();refreshSide();updateSession();setMode("learn");updateExamButtons();
    document.querySelector("#loading").style.display="none";
    maybeStartTutorial();
  }catch(e){
    console.error("Taiwan 368 Trainer init error:", e);
    const isFile = location.protocol === "file:";
    document.querySelector("#loading").innerHTML =
      `地圖資料載入失敗。<br><small>${String(e && e.message ? e.message : e)}</small><br><br>
       ${isFile ? "這是 DIRECT 版，請確認 Chrome 有網路後重新整理。" : "請確認網路後重新整理。"}<br>
       <small>版本：v3.3 PRE-RENDER</small>`;
  }
}

const beginnerModeInput=document.querySelector("#beginnerMode");
const hardModeInput=document.querySelector("#hardMode");
const extremeModeInput=document.querySelector("#extremeMode");

const hardModeBtn=document.querySelector("#hardModeBtn");
const extremeModeBtn=document.querySelector("#extremeModeBtn");

function refreshDifficultyUI(){
  beginnerModeBtn?.classList.toggle("active",!!beginnerModeInput?.checked);
  hardModeBtn?.classList.toggle("active",!!hardModeInput?.checked);
  extremeModeBtn?.classList.toggle("active",!!extremeModeInput?.checked);

  beginnerModeBtn?.setAttribute("aria-pressed",beginnerModeInput?.checked?"true":"false");
  hardModeBtn?.setAttribute("aria-pressed",hardModeInput?.checked?"true":"false");
  extremeModeBtn?.setAttribute("aria-pressed",extremeModeInput?.checked?"true":"false");
}

function setDifficultyMode(nextMode){
  const beginnerWasOn=!!beginnerModeInput.checked;
  const hardWasOn=!!hardModeInput.checked;
  const extremeWasOn=!!extremeModeInput.checked;

  // All three difficulty assists/challenges are mutually exclusive.
  beginnerModeInput.checked=false;
  hardModeInput.checked=false;
  extremeModeInput.checked=false;

  if(nextMode==="beginner"){
    beginnerModeInput.checked=!beginnerWasOn;
  }else if(nextMode==="hard"){
    hardModeInput.checked=!hardWasOn;
  }else if(nextMode==="extreme"){
    extremeModeInput.checked=!extremeWasOn;
  }

  refreshDifficultyUI();
  applyPersistentMarks();
}

beginnerModeBtn.onclick=()=>setDifficultyMode("beginner");
hardModeBtn.onclick=()=>setDifficultyMode("hard");
extremeModeBtn.onclick=()=>setDifficultyMode("extreme");

function refreshPanelButtons(){

  const rightHidden=layoutEl.classList.contains("hide-right");
  document.querySelector("#toggleLeft").textContent=leftHidden?"顯示訓練面板":"隱藏訓練面板";

  document.querySelector("#toggleRight").classList.toggle("active",rightHidden);

let panelTransitionTimer=0;
let mapFocusActive=false;
let mapFocusSnapshot={leftHidden:false,rightHidden:false};

function refreshMapAfterPanelTransition(){
  clearTimeout(panelTransitionTimer);
  panelTransitionTimer=setTimeout(()=>{
    if(mode==="learn"){
      updateLabelVisibility(currentZoomK);
      scheduleLabelLayout();
    }
  },360);

function updateFocusMapButton(){
  const button=document.querySelector("#focusMapBtn");
  const icon=button?.querySelector(".focus-map-icon");
  if(!button||!icon)return;

  button.classList.toggle("active",mapFocusActive);
  icon.textContent=mapFocusActive?"⤡":"⤢";
  button.setAttribute("aria-label",mapFocusActive?"退出專注地圖":"專注地圖");
  button.title=mapFocusActive?"退出專注地圖":"專注地圖";
}

function setMapFocus(active){
  const next=!!active;
  if(next===mapFocusActive)return;

  if(next){
    mapFocusSnapshot={
      leftHidden:layoutEl.classList.contains("hide-left"),
      rightHidden:layoutEl.classList.contains("hide-right")
    };
    mapFocusActive=true;
    layoutEl.classList.add("hide-left","hide-right");
  }else{
    mapFocusActive=false;
    layoutEl.classList.toggle("hide-left",!!mapFocusSnapshot.leftHidden);
    layoutEl.classList.toggle("hide-right",!!mapFocusSnapshot.rightHidden);
  }

  refreshPanelButtons();
  updateFocusMapButton();
  refreshMapAfterPanelTransition();
}

function togglePanel(className){
  // A manual panel change exits focus mode and keeps the user's new layout.
  if(mapFocusActive){
    mapFocusActive=false;
    mapFocusSnapshot={leftHidden:false,rightHidden:false};
    updateFocusMapButton();
  }

  layoutEl.classList.toggle(className);
  refreshPanelButtons();
  refreshMapAfterPanelTransition();
}

function hasAnyStoredProgress(){
  return Object.values(stats||{}).some(item=>
    ((item?.right||0)+(item?.wrong||0))>0
  ) || correctHistory.size>0 || missedHistory.size>0 ||
    session.correct>0 || session.wrong>0;
}

function spawnClearProgressDust(){
  const layer=document.createElement("div");
  layer.className="clear-dust-layer";
  document.body.appendChild(layer);

  const sources=[
    document.querySelector(".sidebar"),
    document.querySelector(".right")
  ].filter(Boolean);

  for(const source of sources){
    const rect=source.getBoundingClientRect();
    if(rect.width<=0||rect.height<=0)continue;

    const count=Math.max(18,Math.round((rect.width*rect.height)/16000));

    for(let i=0;i<count;i++){
      const particle=document.createElement("span");
      particle.className="clear-dust-particle";

      const x=rect.left+Math.random()*rect.width;
      const y=rect.top+Math.random()*rect.height;
      const dx=(Math.random()*.75+.2)*70;
      const dy=-(Math.random()*.8+.25)*80+(Math.random()-.5)*24;
      const size=(Math.random()*4+2).toFixed(1);
      const time=(Math.random()*.26+.52).toFixed(2);
      const delay=(Math.random()*.16).toFixed(2);
      const rotate=((Math.random()-.5)*280).toFixed(0);

      particle.style.left=`${x}px`;
      particle.style.top=`${y}px`;
      particle.style.setProperty("--dust-x",`${dx}px`);
      particle.style.setProperty("--dust-y",`${dy}px`);
      particle.style.setProperty("--dust-r",`${rotate}deg`);
      particle.style.setProperty("--dust-size",`${size}px`);
      particle.style.setProperty("--dust-time",`${time}s`);
      particle.style.setProperty("--dust-delay",`${delay}s`);

      layer.appendChild(particle);
    }
  }

  setTimeout(()=>layer.remove(),950);
}

function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function animateProgressClear(){
  const resetButtons=[
    document.querySelector("#resetStats"),
    document.querySelector("#mobileResetStatsBtn")
  ].filter(Boolean);

  resetButtons.forEach(button=>{
    button.classList.add("is-clearing");
    button.dataset.originalText=button.textContent;
    button.textContent="清除中…";
  });

  document.body.classList.add("progress-vanishing");
  spawnClearProgressDust();

  await wait(560);

  document.body.classList.remove("progress-vanishing");

  resetButtons.forEach(button=>{
    button.classList.remove("is-clearing");
    button.textContent=button.dataset.originalText||"清除進度";
    delete button.dataset.originalText;
  });
}

let clearingProgress=false;
document.querySelector("#resetStats").onclick=async()=>{
  if(clearingProgress)return;
  if(!confirm("確定清除所有學習進度與錯題紀錄？"))return;

  clearingProgress=true;
  const hadProgress=hasAnyStoredProgress();

  if(hadProgress){
    await animateProgressClear();
  }

  if(examActive)stopExam({restore:true});
  stats={};
  correctHistory=new Set();
  missedHistory=new Set();
  localStorage.removeItem(STORE_KEY);
  session={correct:0,wrong:0,times:[]};
  updateSession();
  refreshSide();
  resetCurrentPlaceCard();
  clearMarks();

  clearingProgress=false;
};

function tutorialIsMobile(){
  return window.matchMedia("(max-width:760px)").matches;
}

function tutorialTargetForStep(step){
  const selector=tutorialIsMobile()
    ? (step.mobileTarget||step.target||step.desktopTarget)
    : (step.desktopTarget||step.target||step.mobileTarget);
  if(!selector)return null;
  const el=document.querySelector(selector);
  if(!el)return null;
  const rect=el.getBoundingClientRect();
  if(rect.width<2||rect.height<2)return null;
  return el;
}

function tutorialPrepareMobilePanel(step){
  if(!tutorialIsMobile())return;

  settingsDrawer?.classList.remove("mobile-open");
  progressDrawer?.classList.remove("mobile-open");
  mobileOverlay?.classList.remove("open");

  if(step.mobilePanel==="settings"){
    settingsDrawer?.classList.add("mobile-open");
  }else if(step.mobilePanel==="progress"){
    progressDrawer?.classList.add("mobile-open");
  }
}

function tutorialPositionCard(target){
  const gap=14;
  const pad=10;
  const vw=window.innerWidth;
  const vh=window.innerHeight;

  tutorialCard.classList.remove("side-placement");

  if(tutorialIsMobile()){
    const cardRect=tutorialCard.getBoundingClientRect();
    const left=Math.max(pad,(vw-cardRect.width)/2);
    const top=Math.max(
      pad,
      vh-cardRect.height-14-(window.visualViewport?.offsetTop||0)
    );
    tutorialCard.style.left=`${left}px`;
    tutorialCard.style.top=`${Math.min(top,vh-cardRect.height-pad)}px`;
    return;
  }

  if(!target){
    const cardRect=tutorialCard.getBoundingClientRect();
    tutorialCard.style.left=`${Math.max(pad,(vw-cardRect.width)/2)}px`;
    tutorialCard.style.top=`${Math.max(pad,(vh-cardRect.height)/2)}px`;
    return;
  }

  const r=target.getBoundingClientRect();

  // For a large highlighted target (especially the full map), keep the
  // tutorial card outside the spotlight instead of covering the content.
  const largeTarget=
    r.width>vw*.48 ||
    r.height>vh*.58;

  if(largeTarget){
    tutorialCard.classList.add("side-placement");
  }

  // Re-measure after side-placement width is applied.
  const cardRect=tutorialCard.getBoundingClientRect();
  const leftSpace=r.left-gap-pad;
  const rightSpace=vw-r.right-gap-pad;

  let left;
  let top;

  // Prefer the side with enough room. If neither side fully fits, use the
  // larger gutter and clamp the compact card inside the viewport.
  if(rightSpace>=cardRect.width || rightSpace>=leftSpace){
    left=r.right+gap;
  }else{
    left=r.left-cardRect.width-gap;
  }

  left=Math.max(pad,Math.min(vw-cardRect.width-pad,left));

  // Vertically center the card relative to the highlighted block where possible.
  top=r.top+(r.height-cardRect.height)/2;
  top=Math.max(pad,Math.min(vh-cardRect.height-pad,top));

  // If the chosen card rectangle would overlap a large target because neither
  // gutter is wide enough, explicitly anchor it to the larger screen edge.
  if(largeTarget){
    if(leftSpace>=rightSpace){
      left=pad;
    }else{
      left=vw-cardRect.width-pad;
    }
    top=Math.max(pad,Math.min(vh-cardRect.height-pad,top));
  }

  tutorialCard.style.left=`${left}px`;
  tutorialCard.style.top=`${top}px`;
}

function tutorialPositionSpotlight(target){
  const blocker=document.querySelector("#tutorialBlocker");

  if(!target){
    tutorialSpotlight.classList.remove("visible");
    tutorialSpotlight.style.width="0px";
    tutorialSpotlight.style.height="0px";
    blocker?.classList.add("full-dim");
    tutorialPositionCard(null);
    return;
  }

  blocker?.classList.remove("full-dim");

  const r=target.getBoundingClientRect();
  const expand=tutorialIsMobile()?7:8;
  tutorialSpotlight.style.left=`${Math.max(4,r.left-expand)}px`;
  tutorialSpotlight.style.top=`${Math.max(4,r.top-expand)}px`;
  tutorialSpotlight.style.width=`${Math.min(window.innerWidth-8,r.width+expand*2)}px`;
  tutorialSpotlight.style.height=`${Math.min(window.innerHeight-8,r.height+expand*2)}px`;
  tutorialSpotlight.classList.add("visible");
  tutorialPositionCard(target);
}

function tutorialRenderDots(){
  tutorialDots.innerHTML="";
  TUTORIAL_STEPS.forEach((_,index)=>{
    const dot=document.createElement("span");
    if(index===tutorialStepIndex)dot.classList.add("active");
    tutorialDots.appendChild(dot);
  });
}

function renderTutorialStep(){
  const step=TUTORIAL_STEPS[tutorialStepIndex];
  tutorialTitle.textContent=step.title;
  tutorialBody.innerHTML=step.body;
  tutorialStepCount.textContent=`${tutorialStepIndex+1} / ${TUTORIAL_STEPS.length}`;
  tutorialPrevBtn.disabled=tutorialStepIndex===0;
  tutorialNextBtn.textContent=
    tutorialStepIndex===TUTORIAL_STEPS.length-1?"完成":"下一步";
  tutorialSkipBtn.style.visibility=
    tutorialStepIndex===TUTORIAL_STEPS.length-1?"hidden":"visible";
  tutorialRenderDots();

  tutorialPrepareMobilePanel(step);

  clearTimeout(tutorialRepositionTimer);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      tutorialPositionSpotlight(tutorialTargetForStep(step));
      tutorialRepositionTimer=setTimeout(()=>{
        tutorialPositionSpotlight(tutorialTargetForStep(step));
      },tutorialIsMobile()?260:80);
    });
  });
}

function tutorialSaveLayout(){
  tutorialLayoutSnapshot={
    leftHidden:layoutEl?.classList.contains("hide-left"),
    rightHidden:layoutEl?.classList.contains("hide-right")
  };
  tutorialMapFocusSnapshot=!!mapFocusActive;
}

function tutorialNormalizeDesktopLayout(){
  if(tutorialIsMobile())return;
  if(mapFocusActive){
    mapFocusActive=false;
    updateFocusMapButton();
  }
  layoutEl?.classList.remove("hide-left","hide-right");
  refreshPanelButtons();
}

function tutorialRestoreLayout(){
  if(tutorialIsMobile()){
    settingsDrawer?.classList.remove("mobile-open");
    progressDrawer?.classList.remove("mobile-open");
    mobileOverlay?.classList.remove("open");
    return;
  }

  if(tutorialLayoutSnapshot){
    layoutEl?.classList.toggle("hide-left",!!tutorialLayoutSnapshot.leftHidden);
    layoutEl?.classList.toggle("hide-right",!!tutorialLayoutSnapshot.rightHidden);
    refreshPanelButtons();
  }

  mapFocusActive=false;
  updateFocusMapButton();
  refreshMapAfterPanelTransition();
}

function startTutorial(stepIndex=0){
  if(tutorialOpen)return;

  if(examActive)stopExam({restore:true});
  closeMobilePanels();
  tutorialSaveLayout();
  tutorialNormalizeDesktopLayout();

  tutorialOpen=true;
  tutorialStepIndex=Math.max(0,Math.min(TUTORIAL_STEPS.length-1,stepIndex));
  document.body.classList.add("tutorial-active");
  tutorialRoot.classList.add("open");
  tutorialRoot.setAttribute("aria-hidden","false");

  renderTutorialStep();
}

function finishTutorial({completed=true}={}){
  if(!tutorialOpen)return;

  tutorialOpen=false;
  clearTimeout(tutorialRepositionTimer);
  tutorialRoot.classList.remove("open");
  tutorialRoot.setAttribute("aria-hidden","true");
  document.body.classList.remove("tutorial-active");
  tutorialSpotlight.classList.remove("visible");
  document.querySelector("#tutorialBlocker")?.classList.remove("full-dim");

  if(completed){
    try{localStorage.setItem(TUTORIAL_STORE_KEY,"1")}catch(_){}
  }

  tutorialRestoreLayout();
}

function maybeStartTutorial(){
  let completed=false;
  try{completed=localStorage.getItem(TUTORIAL_STORE_KEY)==="1"}catch(_){}
  if(!completed){
    setTimeout(()=>startTutorial(0),280);
  }
}

tutorialPrevBtn.onclick=()=>{
  if(tutorialStepIndex<=0)return;
  tutorialStepIndex--;
  renderTutorialStep();
};

tutorialNextBtn.onclick=()=>{
  if(tutorialStepIndex>=TUTORIAL_STEPS.length-1){
    finishTutorial({completed:true});
    return;
  }
  tutorialStepIndex++;
  renderTutorialStep();
};

tutorialSkipBtn.onclick=()=>finishTutorial({completed:true});
document.querySelector("#tutorialBtn").onclick=()=>startTutorial(0);
document.querySelector("#mobileTutorialBtn").onclick=()=>{
  closeMobilePanels();
  setTimeout(()=>startTutorial(0),80);
};

tutorialRoot.addEventListener("wheel",event=>{
  if(tutorialOpen && !tutorialCard.contains(event.target))event.preventDefault();
},{passive:false});

tutorialRoot.addEventListener("touchmove",event=>{
  if(tutorialOpen && !tutorialCard.contains(event.target))event.preventDefault();
},{passive:false});

tutorialRoot.addEventListener("click",event=>{
  // The background intentionally does nothing. Tutorial buttons are the only
  // way to advance/finish, matching the dashboard onboarding behavior.
  if(event.target===tutorialRoot || event.target===document.querySelector("#tutorialBlocker")){
    event.preventDefault();
    event.stopPropagation();
  }
});

window.addEventListener("resize",()=>{
  if(!tutorialOpen)return;
  clearTimeout(tutorialRepositionTimer);
  tutorialRepositionTimer=setTimeout(renderTutorialStep,60);
},{passive:true});
